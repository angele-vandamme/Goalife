<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Goalife - Accueil</title>
  <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>

  <div class="layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="logo">Goalife</div>

      <button id="btn-compte" onclick="navigate('compte')">Compte</button>
      <button id="btn-nouvel" onclick="navigate('nouvel-objectif')">Nouvel objectif</button>
      <button id="btn-pro"    onclick="navigate('objectif-pro')">Objectif Pro</button>
      <button id="btn-perso"  onclick="navigate('objectif-perso')">Objectif Perso</button>

      <div class="user-name" id="user-name">Prénom</div>
      <button onclick="navigate('parametres')">Paramètres</button>
    </aside>

    <!-- MAIN -->
    <main class="main">

      <!-- TOP BAR — unique, avec onclick -->
      <div class="topbar" onclick="navigate('a-propos')" style="cursor: pointer;">
        <span>A propos</span>
        <div class="info-icon">i</div>
      </div>

      <div class="dashboard-card">
        <h1>Dashboard</h1>

        <div class="stats-row">
          <div class="stat-box">
            <div class="label">Objectif réalisé</div>
            <div class="value" id="stat-realise">0</div>
          </div>
          <div class="stat-box">
            <div class="label">En cours</div>
            <div class="value" id="stat-encours">0</div>
          </div>
          <div class="stat-box">
            <div class="label">A réaliser</div>
            <div class="value" id="stat-arealiser">0</div>
          </div>
        </div>

        <div class="last-goal">
          <h2>Last goal</h2>
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>Nom</th>
                  <th>Statut</th>
                  <th>Durée</th>
                  <th>Description</th>
                  <th>Catégorie</th>
                  <th>Importance</th>
                </tr>
              </thead>
              <tbody id="last-goal-body">
                <tr class="empty-row"><td colspan="6"></td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>

  </div>

  <script src="../dashboard-renderer.js"></script>
</body>
</html>
